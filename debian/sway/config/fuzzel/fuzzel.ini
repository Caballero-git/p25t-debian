# P25T fuzzel config (launcher, Super+d) - repo: debian/sway/config/fuzzel/fuzzel.ini
# Installed as ~/.config/fuzzel/fuzzel.ini by the card build (debian/sway/setup.sh).

[main]
# Same font as foot. dpi-aware=no: fuzzel otherwise scales the font by the
# panel's ~150 dpi and draws it huge (seen 2026-10-15).
font=Terminus:pixelsize=18
dpi-aware=no
# Programs that run in a terminal (micro, htop, ...) are opened in foot
terminal=foot -e

[colors]
# Light text on a dark box, the colours of foot's "dim" palette
# (fuzzel's default is a near-white box, hard to read - 2026-10-15).
# Format RRGGBBAA.
background=1c1c1cff
text=b0b0b0ff
prompt=b0b0b0ff
input=d0d0d0ff
match=c8b464ff
selection=3a5aaaff
selection-text=d0d0d0ff
selection-match=c8b464ff
border=5c5c5cff
