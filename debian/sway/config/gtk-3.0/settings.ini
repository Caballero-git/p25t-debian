# P25T GTK 3 settings - repo: debian/sway/config/gtk-3.0/settings.ini
# Installed as ~/.config/gtk-3.0/settings.ini by the card build (debian/sway/setup.sh).
# GTK programs (zathura, Firefox's frame and dialogs) use the dark variant
# of their theme, to match foot and fuzzel (light text on dark, 2026-10-15).
# Firefox also reports "dark" to web pages that offer a dark style.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-font-name=DejaVu Sans 11
