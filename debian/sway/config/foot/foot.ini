# P25T foot config - repo: debian/sway/config/foot/foot.ini
# Installed as ~/.config/foot/foot.ini by the card build (debian/sway/setup.sh).

[main]
# Terminus 18 px: the console's font, one size smaller so a window keeps
# enough characters per line (chosen 2026-10-15)
font=Terminus:pixelsize=18

[colors]
# "dim": the same 16 colours as card 1's console palette
# (p25t-linux/debian/p25t-console-colors.sh, palette dim) - the usual
# colours toned down: background #1c1c1c instead of black, text #b0b0b0,
# bold/bright #d0d0d0 instead of pure white (chosen 2026-10-15: foot's
# default colours were too bright and sometimes hard to read).
# Newer foot calls this section [colors-dark]; [colors] still works.
background=1c1c1c
foreground=b0b0b0
regular0=1c1c1c
regular1=aa3a3a
regular2=3a9a3a
regular3=aa7a2a
regular4=3a5aaa
regular5=9a4a9a
regular6=3a9a9a
regular7=b0b0b0
bright0=5c5c5c
bright1=c86464
bright2=64b464
bright3=c8b464
bright4=6482c8
bright5=b464b4
bright6=64b4b4
bright7=d0d0d0
